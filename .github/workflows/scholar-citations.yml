name: Update Google Scholar citations

on:
  schedule:
    # minute 20 of every hour, UTC
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read citation count
        run: python3 scripts/update-scholar-citations.py
      - name: Commit if the count changed
        run: |
          git diff --quiet assets/gs-citations.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gs-citations.json
          git commit -m "chore: refresh Google Scholar citation count"
          git push
