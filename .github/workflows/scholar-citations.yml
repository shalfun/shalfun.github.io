name: Update Google Scholar citations

on:
  schedule:
    # Several chances per day. The script reads only once, after a time
    # derived from the date, and the 22:11 UTC run catches a missed slot.
    - cron: "11 1,7,13,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: today
        with:
          path: .scholar-checked
          key: scholar-checked-${{ steps.day.outputs.day }}
      - name: Read citation count
        env:
          SCHOLAR_EVENT: ${{ github.event_name }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python3 scripts/update-scholar-citations.py
      - name: Remember today's check
        if: success() && steps.today.outputs.cache-hit != 'true' && hashFiles('.scholar-checked') != ''
        uses: actions/cache/save@v6
        with:
          path: .scholar-checked
          key: scholar-checked-${{ steps.day.outputs.day }}
      - name: Commit if the count changed
        if: success()
        run: |
          git diff --quiet -- assets/gs-citations.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/gs-citations.json
          git commit -m "chore: refresh Google Scholar citation count"
          git push
