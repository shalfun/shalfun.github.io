/* Page shell extracted from styles.css / reader.css for the second slice. */
:root {
  color-scheme: dark;
  --lime: #d4eb8e;
  --display: "Manrope", "DM Sans", sans-serif;
  --body: "DM Sans", sans-serif;
  --mono: "DM Mono", monospace;

}
* { box-sizing: border-box; }
html { background: #e0e5d8; }
body { margin: 0; color: #eff1e9; font-family: var(--body); }
button, input { font: inherit; }
button, a { color: inherit; }
[hidden] { display: none !important; }
a, button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
.slice-shell { max-width: 1520px; padding: 20px; margin: auto; }
.research-section {
  position: relative;
  padding: 14px clamp(24px, 3.1vw, 55px) 10px;
  height: calc(100svh - 40px);
  min-height: 560px;
  border: 1px solid #294b33;
  background: #1b3026;
}
.research-section .research-content {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  width: 100%;
  max-width: 1450px;
  margin: auto;
}
.section-kicker { display: flex; align-items: center; gap: 12px; color: #94ab85; font: 10px var(--mono); letter-spacing: .12em; }
.section-kicker > span:first-child { color: #b0c599; }
.section-kicker i { width: 28px; height: 1px; background: #536c49; }
.research-heading { padding: 8px 0 12px; align-items: center; gap: 26px; }
.research-heading h2 { flex: none; margin: 0; font: 600 clamp(28px, 2.7vw, 40px)/1.12 var(--display); letter-spacing: -.055em; }
.publication-summary, .publication-projects { font-size: 12px; line-height: 1.55; }
.research-section .research-map { flex: 1; height: auto; min-height: 360px; }
.research-section .map-stage { flex: 1; height: auto; min-height: 240px; }
.research-footer { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 6px; color: #758b7c; font: 8px/1.3 var(--mono); letter-spacing: .09em; }
.research-footer > span:nth-child(2) { max-width: none; }

/* Standalone preview: paper details / topic contents use a native dialog. */
.slice-dialog { width: min(760px, calc(100vw - 32px)); max-height: 86svh; overflow: auto; margin: auto; padding: 26px; border: 1px solid #627b50; color: #e3ecd5; background: #182d23; }
.slice-dialog::backdrop { background: #08150fc9; }
.slice-dialog header { display: flex; align-items: flex-start; gap: 20px; }
.slice-dialog h2 { flex: 1; margin: 0; font: 600 23px/1.45 var(--display); overflow-wrap: anywhere; }
.slice-dialog form { margin: 0; }
.slice-dialog form button { width: 32px; height: 32px; border: 1px solid #526a56; background: #243c2c; cursor: pointer; font-size: 22px; }
.slice-dialog p { color: #bed0b7; font-size: 14px; line-height: 1.8; }
.slice-dialog .paper-venue { color: #a9bd9b; font: 11px/1.7 var(--mono); }
.paper-topics, .paper-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.paper-topics span { padding: 4px 8px; border: 1px solid #405b44; color: #b5c8a3; font-size: 11px; }
.paper-links a { padding: 8px 12px; border: 1px solid #627b50; color: var(--lime); font-size: 12px; text-decoration: none; }
.topic-paper-list { display: grid; gap: 1px; margin: 20px 0 0; padding: 0; list-style: none; }
.topic-paper-list button { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; padding: 13px 4px; border: 0; border-bottom: 1px solid #3a5242; color: #e3ecd5; background: transparent; text-align: left; cursor: pointer; }
.topic-paper-list small { color: #9caf92; text-align: right; font: 10px/1.6 var(--mono); }

@media (min-width: 1650px) {
  .publication-summary, .publication-projects { font-size: 14px; }
}
@media (max-width: 1200px) {
  .research-heading { display: block; }

@media (max-width: 980px) {

  .map-topic-chip button:first-child { font-size: 8px; }
  .research-footer { font-size: 8px; gap: 8px; }
  .slice-dialog { padding: 20px; }
  .slice-dialog h2 { font-size: 19px; }
}

  const regionSpecs = {

    worldmodel: {center: [-.4, -.4, -.1], radius: [2.8, 1.9, 2.1]},
    embodied: {center: [1.3, .7, -.1], radius: [2.4, 1.9, 1.9]},
    robotics: {center: [1.3, .2, -.45], radius: [1.95, 1.9, 1.7]},
    llm: {center: [.4, -.15, -.65], radius: [1.8, 3.1, .8]},
    infra: {center: [3.3, 1.1, 1.15], radius: [1.3, 1.5, 1.3]},
    driving: {center: [-1.15, -2, .25], radius: [2.1, 2.1, 1.85]},

  const abbreviations={

    "when-numbers-speak":"WNS", "360-video-generation":"OmniPano",
    "world-models-for-ad":"WM for AD", "probabilistic-decisions":"Prob. Decisions",
    "visual-specialists":"Vis. Specialists", "vision-remember":"Vis. Remember",
    "revisiting-mllms":"Revisit-MLLMs",

  const defaultView = {yaw: -.25, pitch: -.2, zoom: 1};

  const topicAngles={"3d":-140,media:-175,llm:-90,infra:-45,embodied:-30,robotics:40,driving:95,worldmodel:130};
  const metric = (point, region) => point.reduce((sum, value, axis) => sum + ((value-region.center[axis])/region.radius[axis])**2, 0);
  const halton = (index, base) => {let value=0, fraction=1;while(index){fraction/=base;value+=fraction*(index%base);index=Math.floor(index/base);}return value;};

    const placed=[];
    // Place the most constrained intersections first, then spread papers inside
    // each feasible region. Resizing or selecting topics never changes XYZ.
    for(const [signature,papers] of [...signatures].sort((a,b)=>b[0].split("|").length-a[0].split("|").length||a[0].localeCompare(b[0]))){
      const members=signature.split("|"),inside=regions.filter(region=>members.includes(region.id));

      else{gesture=null;stage.classList.remove("is-dragging");}pauseMotionBriefly();schedule();
    }
    stage.addEventListener("pointerup",release);stage.addEventListener("pointercancel",release);
    stage.addEventListener("pointerleave",event=>{if(!stage.hasPointerCapture(event.pointerId)&&pointers.size<2)release(event);if(!nodes.some(n=>n.button===document.activeElement))setHovered(null);});
    stage.addEventListener("wheel",event=>{event.preventDefault();view.zoom=clamp(view.zoom*Math.exp(-event.deltaY*.0012),.6,2.3);setHovered(null);pauseMotionBriefly();schedule();},{passive:false});
    canvas.addEventListener("keydown",event=>{
      if(!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","+","=","-","Home","Escape"].includes(event.key))return;
      event.preventDefault();event.stopPropagation();pauseMotionBriefly();
      
      if(event.key==="Home")reset();else if(event.key==="Escape"){activeTopics.clear();updateSelection();setHovered(null);}
      else if(event.key==="ArrowLeft")view.yaw-=.12;else if(event.key==="ArrowRight")view.yaw+=.12;
      else if(event.key==="ArrowUp")view.pitch=clamp(view.pitch-.12,-1.15,1.15);else if(event.key==="ArrowDown")view.pitch=clamp(view.pitch+.12,-1.15,1.15);
      else view.zoom=clamp(view.zoom*(event.key==="-"?1/1.2:1.2),.6,2.3);schedule();
    });
    groups.forEach(group=>{
      const curves=[0,1,2].map(axis=>ringCircle.map(([cos,sin])=>{
        const n=[0,0,0];n[(axis+1)%3]=cos;n[(axis+2)%3]=sin;return n;
      }));
      for(const latitude of [-.52,.52])curves.push(ringCircle.map(([cos,sin])=>[Math.sqrt(1-latitude*latitude)*cos,latitude,Math.sqrt(1-latitude*latitude)*sin]));
      group.rings=curves.map(unit=>({unit,points:unit.map(n=>n.map((v,i)=>group.center[i]+group.radius[i]*v)),screen:unit.map(()=>({}))}));
      group.surfaceSprite=sprite(192,192,c=>{
        const light=c.createRadialGradient(62,53,4,96,96,121);
        light.addColorStop(0,tint(group.color,.23));light.addColorStop(.32,tint(group.color,.12));light.addColorStop(.72,tint(group.color,.028));light.addColorStop(1,tint(group.color,.006));
        c.beginPath();c.arc(96,96,95.5,0,TAU);c.fillStyle=light;c.fill();
      });
    });
    root.dataset.pointCount=String(nodes.length);root.dataset.coordinateSystem="shared-xyz";
    new ResizeObserver(resize).observe(stage);resize();
    document.fonts.ready.then(resize);
    new IntersectionObserver(entries=>{inView=entries[0].isIntersecting;syncMotion();},{threshold:0}).observe(stage);
    syncMotion();
  }
  window.ResearchMap={create,layout};
})();

</script>
  <script>
/* Only used by the standalone demo; replace these callbacks in your site. */
window.PublicationPreview = (() => {
  const dialog = document.querySelector("#slice-detail");
  const title = document.querySelector("#slice-detail-title");
  const content = document.querySelector("#slice-detail-content");
  const element = (tag, text, className) => {
    const node = document.createElement(tag);
    if (text != null) node.textContent = text;
    if (className) node.className = className;
    return node;
  };
  let papers, themes, shortVenue;

  function show() {
    if (!dialog.open) dialog.showModal();
    dialog.scrollTop = 0;
  }

  function openPaper(id) {
    const paper = papers.find(item => item.id === id);
    if (!paper) return;
    title.textContent = paper.title;
    content.replaceChildren(
      element("p", shortVenue(paper), "paper-venue"),
      element("p", paper.summary || "")
    );
    const tags = element("div", null, "paper-topics");
    paper.themes.forEach(topic => tags.append(element("span", themes.find(item => item.id === topic)?.label || topic)));
    content.append(tags);
    const links = element("nav", null, "paper-links");
    links.setAttribute("aria-label", "论文与项目资源");
    for (const resource of paper.links || []) {
      try {
        const url = new URL(resource.url);
        if (!["http:", "https:"].includes(url.protocol)) continue;
        const link = element("a", resource.label + " ↗");
        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        links.append(link);
      } catch { /* Ignore incomplete resource URLs. */ }
    }
    if (links.childElementCount) content.append(links);
    show();
  }

  function openTopic(id) {
    const theme = themes.find(item => item.id === id);
    if (!theme) return;
    const members = papers.filter(paper => paper.themes.includes(id));
    title.textContent = theme.label;
    const list = element("ul", null, "topic-paper-list");
    for (const paper of members) {
      const item = element("li");
      const button = element("button");
      button.type = "button";
      button.append(element("span", paper.shortTitle), element("small", shortVenue(paper)));
      button.addEventListener("click", () => openPaper(paper.id));
      item.append(button);
      list.append(item);
    }
    content.replaceChildren(element("p", `${members.length} 项工作`), list);
    show();
  }

  return {
    configure(data) { ({ papers, themes, shortVenue } = data); },
    openPaper,
    openTopic,
  };
})();

</script>
  <script>
/* Themes, summary and venue formatting extracted from the current app.js. */
(() => {
  const papers = window.PROJECTS || [];
  const themes = window.PUBLICATION_THEMES = [
    { id: "3d", label: "3D Vision / Generation", color: "#e7aa77" },
    { id: "media", label: "Image / Video Generation", color: "#a7b9ef" },
    { id: "llm", label: "LLM / MLLM", color: "#c3a7f0" },
    { id: "embodied", label: "VLA · Embodied Models", color: "#d5ef80" },
    { id: "infra", label: "Model Infrastructure", color: "#82d4bd" },
    { id: "robotics", label: "Robotics", color: "#f0c975" },
    { id: "driving", label: "Autonomous Driving", color: "#ed947b" },
    { id: "worldmodel", label: "World Models", color: "#8ed2c7" },
  ];

  function shortVenue(paper) {
    const venue = paper.venue || "";
    if (/under review/i.test(venue)) return "UNDER REVIEW";
    const honor = /\[(.*?)\]/.exec(venue)?.[1];
    const names = ["CVPR", "ICCV", "ECCV", "ICML", "ICRA", "IJCAI", "SIGGRAPH", "TPAMI", "TMM", "ICIP", "TIP", "ACM MM", "RAL"];
    const name = names.find(candidate => venue.toUpperCase().includes(candidate));
    const year = /\b20\d{2}\b/.exec(venue)?.[0] || String(paper.year || "");
    if (name) return `${name}${/workshop/i.test(venue) ? " Workshop" : ""}${year ? ` ${year}` : ""}${honor ? ` · ${honor.toUpperCase()}` : ""}`;
    if (/arXiv/i.test(venue)) return `arXiv · ${paper.arxiv || year}`;
    return `${venue.replace(/\s*,\s*20\d{2}.*$/, "")} ${year}`.trim();
  }

  function renderPublicationSummary() {
    // Owner-provided totals are independent of the archive's per-work metadata.
    const honors = [[2, "Highlight", "highlight"], [1, "Workshop Best Paper", "best-paper"], [4, "Oral", "oral"]]
      .map(([count, label, id]) => `<span class="publication-phrase"><strong data-stat="${id}">${count}</strong> ${label}</span>`).join(" · ");
    document.querySelector("#publication-summary").innerHTML = `<strong data-stat="top-conference">27</strong> papers accepted to top-tier conference main tracks, including <strong id="first-count" data-stat="first-author">13</strong> as first / co-first author <span class="publication-honors">(${honors})</span> and <span class="publication-phrase">Project Lead on <strong data-stat="project-lead">12</strong>.</span>`;
    document.querySelector("#unique-count").textContent = papers.length;
    document.querySelector("#field-count").textContent = themes.length;
    document.querySelector("#accepted-count").textContent = papers.filter(paper => paper.status === "published").length;
  }

  renderPublicationSummary();
  window.PublicationPreview.configure({ papers, themes, shortVenue });
  const options = window.PUBLICATIONS_SLICE_OPTIONS || {};
  window.ResearchMap.create(document.querySelector("#theme-map"), {
    projects: papers,
    themes,
    shortVenue,
    openPaper: options.openPaper || window.PublicationPreview.openPaper,
    openTopic: options.openTopic || window.PublicationPreview.openTopic,
  });
})();

</script>
